name: Registry Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  release:
    # kin-actions v0.1.31 archives target/ in two jobs. Do not call it even as
    # a red-path validator: that would spend cache storage before this hold can
    # stop the merge. Restore the reviewed reusable call only at v0.1.34 or
    # newer immutable bytes whose workflow is proven source-cache-only.
    name: Registry release held for kin-actions v0.1.34
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse the unsafe registry workflow
        shell: bash
        run: |
          echo "::error title=Unsafe registry cache workflow::kin-actions v0.1.31 caches target; require reviewed v0.1.34 immutable bytes"
          exit 1
