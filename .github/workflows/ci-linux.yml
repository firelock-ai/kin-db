# Linux build + test for the kin-db graph engine.
#
# kin-db is the pure-Rust semantic engine (graph storage, snapshots, indexing,
# text + vector search). Its default feature set (`vector` + `embeddings`) runs
# transformer inference on CPU via kin-infer, so the whole workspace builds and
# tests on Linux. The macOS-only `metal` feature is deliberately NOT enabled
# here: it pulls the `metal`/`objc2`/`block` crates, which only exist on
# cfg(target_os = "macos") and fail to compile on Linux (unresolved crate).
#
# This is a dedicated, additive workflow (it does not modify ci.yml). It exists
# because agents and CI runners live on Linux, so the engine must have a green
# Linux signal of its own.
name: CI (Linux)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# The sha suffix is empty off main, so every pull request and merge-queue ref
# keeps one group per ref and `cancel-in-progress` supersedes an older push
# exactly as it did before. On main each commit gets its own group, because
# `cancel-in-progress: false` does not mean "never cancel": GitHub keeps at
# most one PENDING run per group and cancels the older one. Two landings in
# quick succession therefore delete the earlier commit's run before it starts
# a job, and a run that started no jobs leaves the commit with its checks
# absent rather than failed. The hosted merge queue lands PRs back to back, so
# that window is the ordinary case here, not a rare one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-build-test:
    name: Linux Build & Test (no Metal)
    runs-on: ubuntu-latest
    # This job produces a required status context, so a hang here does not fail
    # a pull request, it blocks one, and on a merge-queue build it ejects the PR
    # with nothing on the PR saying why. Without this the ceiling is GitHub's
    # six-hour default. Normal runtime is around nine minutes.
    timeout-minutes: 30
    steps:
      # kin-db's committed .cargo/config.toml resolves kin-model, kin-infer,
      # kin-vector, and kin-search through the Kin sparse registry. No sibling
      # checkout or local [patch.kin] entry participates. The Check & Test
      # workflow (ci.yml) proves the same single-checkout dependency path; this
      # Linux workflow mirrors it without reconstructing the retired sibling-
      # checkout or public-git patch schemes.
      - name: Checkout kin-db
        uses: actions/checkout@v7
        with:
          path: kin-db

      - name: Install Rust toolchain
        uses: ./kin-db/.github/actions/rust-toolchain
        with:
          # Downstream release artifacts link this crate statically against musl,
          # so musl is a Linux target this workflow owns rather than a target a
          # release discovers.
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo registry and sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-linux-sources-${{ hashFiles('kin-db/**/Cargo.toml', 'kin-db/.cargo/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-linux-sources-

      # Default features only (vector + embeddings, CPU inference). No `metal`.
      - name: Build
        working-directory: kin-db
        run: cargo build --workspace --all-targets

      # HF_HUB_OFFLINE keeps the run deterministic and offline. The three tests
      # that construct a real embedder and need HF weights are skipped
      # (CI-config, no test code touched) until an offline stub-weights fixture
      # exists, the same skip as ci.yml so both workflows match. Metal-only
      # tests are already #[ignore]. Everything else (graph/storage/search/
      # vector/text) is pure-Rust and runs.
      - name: Test
        working-directory: kin-db
        env:
          HF_HUB_OFFLINE: "1"
        # many_vectors_search_quality runs again here, matching ci.yml. Its
        # duplicate-vector fixture was fixed on 2026-06-12 to assert an
        # exact-match neighbour rather than which tied duplicate wins, so the
        # tie-break change it was skipped for can no longer fail it.
        run: >-
          cargo test --workspace --
          --skip process_embedding_queue_without_embeddings_is_noop
          --skip default_dimensions_match_default_model
          --skip test_vector_index_dimension_mismatch_auto_recovery

      # Optional-feature runtime coverage. The deterministic versioned-object
      # fixture exercises GCS generation/CAS/reopen behavior without credentials;
      # the ignored live-ADC proof remains an explicit release smoke. SQL tests
      # run here as well so transactional recovery and cleanup cannot ship from a
      # compile-only green job. Archive remains compile-covered.
      - name: Test optional storage backends (gcs, sql) and check archive
        working-directory: kin-db
        run: |
          cargo test -p kin-db --lib --features gcs storage::gcs::tests
          cargo test -p kin-db --lib --features sql storage::sql::tests
          cargo check -p kin-db --all-targets --features archive

      # musl-static C dependencies (ring, oniguruma) need a musl-targeting C
      # compiler; musl-tools provides musl-gcc. The same install carries the
      # downstream release build.
      - name: Install musl C toolchain
        # Unbounded, this hung for 27 minutes and counting on 2026-08-19,
        # stalled inside `apt-get` on an Ubuntu mirror while Build, Test and the
        # storage-backend leg had all already passed. It is a known shape in
        # this fleet: a stalled mirror holds an apt call open until the job
        # budget runs out.
        #
        # Each call is bounded and the sequence is retried, because a stalled
        # mirror is transient and a genuinely missing package is not, and an
        # unbounded call makes those two indistinguishable. `-k` escalates to
        # KILL, since a child that ignores TERM would otherwise keep `timeout`
        # waiting on it.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout -k 30 180 sudo apt-get update -o Acquire::Retries=3 \
               && timeout -k 30 300 sudo apt-get install -y --no-install-recommends musl-tools; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed or timed out; retrying"
            sleep $(( attempt * 10 ))
          done
          echo "::error::musl toolchain install failed after 3 bounded attempts" >&2
          exit 1

      # Every downstream release links this crate statically against musl, so a
      # musl-only compile error reaches a release build before it reaches any
      # test. Cross-check the target here instead. A check resolves and type-
      # checks without linking, which is where an environment whose C library
      # exports a different symbol set fails.
      - name: Cross-check the musl target
        working-directory: kin-db
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets --target x86_64-unknown-linux-musl
          # Consumers resolve libc through their own lockfiles, not through this
          # workspace, and the kin release that builds these artifacts resolves
          # 0.2.186. That is the newest libc whose musl module declares no
          # `renameat2` wrapper. A freshly resolved libc hides it, so pin the
          # consumer's version and check again; without this the guard passes
          # whether or not the musl path is sound. Move the pin only when the
          # dependency graph stops resolving it.
          cargo update -p libc --precise 0.2.186
          cargo check --workspace --all-targets --target x86_64-unknown-linux-musl
