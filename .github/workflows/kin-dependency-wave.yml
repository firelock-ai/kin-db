name: Kin Dependency Wave

on:
  repository_dispatch:
    types: [kin-registry-release]
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

jobs:
  dependency-wave:
    permissions:
      contents: write
      pull-requests: write
    uses: firelock-ai/kin-actions/.github/workflows/cargo-dependency-wave.yml@v0.1.25
    with:
      manifests: crates/kin-db/Cargo.toml
      test-command: cargo test -p kin-db --lib
      auto-merge: true
    secrets:
      KIN_CI_BOT_TOKEN: ${{ secrets.KIN_DOWNSTREAM_DISPATCH_TOKEN }}
