name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# The sha suffix is empty off main, so every pull request and merge-queue ref
# keeps one group per ref and `cancel-in-progress` supersedes an older push
# exactly as it did before. On main each commit gets its own group, because
# `cancel-in-progress: false` does not mean "never cancel": GitHub keeps at
# most one PENDING run per group and cancels the older one. Two landings in
# quick succession therefore delete the earlier commit's run before it starts
# a job, and a run that started no jobs leaves the commit with its checks
# absent rather than failed. The hosted merge queue lands PRs back to back, so
# that window is the ordinary case here, not a rare one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # `deprecated` is now enforced: all kin-db call sites of
  # kin-model's deprecated ArtifactId::from_path / ::from_file_id were migrated
  # to the graph-assigned id via the `artifact_index` lookup. The only remaining
  # uses are deterministic legacy-link/migration seed paths carrying local
  # `#[allow(deprecated)]` with justification, so -Dwarnings can deny the lint.
  RUSTFLAGS: -Dwarnings

jobs:
  dco:
    name: DCO Sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          range="${BASE_SHA}..${HEAD_SHA}"
          echo "Checking DCO sign-off for commits in ${range}"
          for sha in $(git rev-list --no-merges "${range}"); do
            author_name=$(git show -s --format='%an' "${sha}")
            author_email=$(git show -s --format='%ae' "${sha}")
            # Bot accounts (dependabot[bot], github-actions[bot], renovate[bot], …)
            # author commits with a name ending in "[bot]" and sign off with a
            # service email that never matches their author email, so the strict
            # match below can never pass for them. Exempt bot-authored commits;
            # every human commit still requires a matching Signed-off-by trailer.
            case "${author_name}" in
              *'[bot]')
                echo "SKIP ${sha} bot author '${author_name}' exempt from DCO"
                continue
                ;;
            esac
            expected="Signed-off-by: ${author_name} <${author_email}>"
            if git show -s --format='%(trailers:key=Signed-off-by)' "${sha}" \
                | grep -qiF "${expected}"; then
              echo "OK   ${sha} ${expected}"
            else
              echo "FAIL ${sha} missing or mismatched sign-off (expected: ${expected})"
              git show -s --format='  author: %an <%ae>%n  trailers:%n%(trailers:key=Signed-off-by)' "${sha}"
              fail=1
            fi
          done
          if [ "${fail}" -ne 0 ]; then
            echo "::error::One or more commits are missing a matching 'Signed-off-by' trailer (DCO). Re-commit with 'git commit -s'."
            exit 1
          fi
          echo "All commits carry a matching DCO sign-off."

  check:
    name: Check & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      # Key on the manifests, not on Cargo.lock. kin-db is a library workspace
      # and gitignores its lockfile, so no Cargo.lock exists when this step
      # runs and `hashFiles` returns an empty string. That left the key frozen
      # at `<os>-cargo-`, and a cache key is immutable, so every later run hit
      # the primary key and skipped the save. The 2026-08-12 main run says so
      # in its own log: "Cache hit occurred on the primary key Linux-cargo-,
      # not saving cache." The cache had stopped tracking the dependency set
      # entirely while still reading as a hit.
      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        shell: bash
        # CLIPPY BURN-DOWN ALLOW-LIST (kin-db).
        # kin-db is the retrieval stack; during the freeze, behavior-adjacent code
        # edits on main are FORBIDDEN, so these pre-existing lints are temporarily
        # ALLOW-LISTED here (CI-config only) instead of fixed in code. -D warnings
        # still applies to everything else, so no NEW lint can slip in. Burn these
        # down one at a time post-freeze (smallest blast radius first); delete each
        # -A line as its lint reaches zero.
        # PRIORITY REVIEW: clippy::suspicious_open_options belongs to the
        # truncate-cousin class (cf. kin-vector .truncate(false) fix); verify
        # open-options intent before clearing, do NOT blindly accept a clippy
        # autofix here.
        # NOTE: the rustc `deprecated` lint is no longer allow-listed:
        # all kin-db call sites were migrated to the graph-assigned ArtifactId via
        # the `artifact_index` lookup, so -D warnings now denies it here too.
        run: |
          cargo clippy --all-targets -- -D warnings \
            -A clippy::assertions_on_constants \
            -A clippy::blocks_in_conditions \
            -A clippy::cloned_ref_to_slice_refs \
            -A clippy::field_reassign_with_default \
            -A clippy::items_after_test_module \
            -A clippy::large_enum_variant \
            -A clippy::let_and_return \
            -A clippy::let_unit_value \
            -A clippy::manual_checked_ops \
            -A clippy::needless_borrows_for_generic_args \
            -A clippy::needless_return \
            -A clippy::redundant_pattern_matching \
            -A clippy::suspicious_open_options \
            -A clippy::type_complexity \
            -A clippy::unnecessary_sort_by \
            -A clippy::useless_conversion

      - name: Build
        run: cargo build --all-targets

      - name: Test
        # HF_HUB_OFFLINE keeps the run deterministic/offline. These three tests
        # construct a real embedder and need HF network plus nomic weights, which
        # CI cannot fetch, so they are skipped here (CI-config, no test code
        # touched) until an offline stub-weights fixture exists. Everything else
        # (graph/storage/search/vector/text) is pure-Rust and runs.
        #
        # many_vectors_search_quality is no longer skipped. It was, because its
        # fixture inserted 100 vectors with only 8 distinct patterns and then
        # asserted which of the identical-distance duplicates won the tie, which
        # flipped when kin-vector moved to a key-hash tie-break. The fixture was
        # fixed on 2026-06-12 to assert what approximate kNN actually promises,
        # that the top hit's stored vector equals the query vector, and it has
        # passed since. A skip outliving its cause hides a real vector-search
        # regression, so the reason has to expire with the defect.
        env:
          HF_HUB_OFFLINE: "1"
        run: >-
          cargo test --
          --skip process_embedding_queue_without_embeddings_is_noop
          --skip default_dimensions_match_default_model
          --skip test_vector_index_dimension_mismatch_auto_recovery

      - name: 100K hydration smoke guard
        # This is a wall-clock guard, so run it outside the parallel suite.
        # `--exact` preserves the macOS/Linux coverage while one test thread
        # prevents the long save/reload test from competing for the runner.
        env:
          HF_HUB_OFFLINE: "1"
        run: >-
          cargo test --test scale_and_failure scale_100k_entities --
          --ignored
          --exact
          --test-threads=1

  # Security audit moved to sast.yml (cargo-deny: advisories + licenses + bans + sources)

  schema-provenance:
    name: Schema Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # schemas/ is schemars output for kin-model types, and kin-model owns the
      # generator, so this repo cannot regenerate them and no runtime path reads
      # them. Both facts together are why they drifted three minor versions
      # behind the pin with CI green the whole way. Comparing the recorded
      # generator version against the pin is the part this repo can prove alone.
      - name: Check schema provenance
        run: ./scripts/check-schema-provenance.sh

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tarpaulin-${{ hashFiles('**/Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tarpaulin-

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Run coverage
        run: |
          if ! cargo tarpaulin --out xml --out stdout; then
            echo "::warning::Tarpaulin is currently non-blocking in CI for the public alpha."
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: firelock-ai/kin-db
          fail_ci_if_error: false
