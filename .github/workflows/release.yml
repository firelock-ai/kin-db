name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      # Mirror ci.yml / ci-linux.yml: HF_HUB_OFFLINE keeps the run deterministic
      # and offline. The three tests that construct a real embedder needing HF
      # weights, plus many_vectors_search_quality, are skipped here too (same skip
      # as CI) until an offline stub-weights fixture exists (post-freeze item).
      - name: Test
        env:
          HF_HUB_OFFLINE: "1"
        run: >-
          cargo test --workspace --
          --skip process_embedding_queue_without_embeddings_is_noop
          --skip default_dimensions_match_default_model
          --skip test_vector_index_dimension_mismatch_auto_recovery
          --skip many_vectors_search_quality

      - name: 100K hydration smoke guard
        # Keep the release gate identical to CI: the timed assertion runs alone
        # on both matrix operating systems instead of racing another scale test.
        env:
          HF_HUB_OFFLINE: "1"
        run: >-
          cargo test --test scale_and_failure scale_100k_entities --
          --ignored
          --exact
          --test-threads=1

  release:
    name: Publish Release
    needs: validate
    runs-on: ubuntu-latest
    # Registry Publish on main publishes the crate, proves a fresh registry-only
    # consumer, and only then mints this tag. Keep registry credentials confined
    # to that main-only workflow; a tag release must not republish the same bytes.
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
