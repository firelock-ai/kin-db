#
# Cloud Build config for kin-db repo.
#
# This config runs the test suite and nothing else. It publishes no crate. The
# kin-db crate is published to the private "kin" registry by the Registry
# Publish workflow on pushes to main, and kin-model is published from its own
# repository, so neither belongs to a tag build here.
#
# The skip list mirrors .github/workflows/ci.yml: the three tests it names
# construct a real embedder and need HF weights this environment cannot fetch.

steps:
  # Run tests
  - name: 'rust:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y pkg-config libssl-dev g++ && rm -rf /var/lib/apt/lists/*
        HF_HUB_OFFLINE=1 cargo test --workspace -- \
          --skip process_embedding_queue_without_embeddings_is_noop \
          --skip default_dimensions_match_default_model \
          --skip test_vector_index_dimension_mismatch_auto_recovery
    id: 'test'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
